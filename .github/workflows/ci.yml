name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: python run.py lint
      - name: Model
        run: python run.py model
      - name: Cocotb smoke/unit
        run: python run.py test --sim icarus
